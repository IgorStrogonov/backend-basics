openapi: 3.1.0
info:
  title: Library API
  description: Сервис для управления библиотекой
  version: 1.0.0
servers:
  - url: https://api.library.example.com/v1
tags:
  - name: Books
    description: Управление книгами
  - name: Readers
    description: Управление читателями
  - name: Loans
    description: Управление выдачами книг
paths:
  /books:
    get:
      tags: [Books]
      summary: Получить список книг
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: author
          in: query
          schema: { type: string }
          description: Фильтр по автору
        - name: sort
          in: query
          schema: { type: string, examples: ["-published_year"] }
          description: "Сортировка. Минус означает по убыванию"
      responses:
        "200":
          description: Список книг
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookListResponse" }
    post:
      tags: [Books]
      summary: Добавить книгу
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookRequest" }
      responses:
        "201":
          description: Книга создана
          headers:
            Location:
              schema: { type: string }
              description: URL созданной книги
        "422":
          description: Ошибка валидации
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                ValidationErrorExample:
                  summary: Пример ошибки валидации полей
                  value:
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Некорректные данные запроса"
                      details:
                        - field: "title"
                          issue: "minLength"
                          message: "Название не может быть пустым"
  /books/{id}:
    get:
      tags: [Books]
      summary: Получить книгу по ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Данные книги
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
              examples:
                BookExample:
                  summary: Пример успешного ответа с данными книги
                  value:
                    id: 1
                    title: "Мастер и Маргарита"
                    author: "Михаил Булгаков"
                    isbn: "978-5-04-118123-4"
                    published_year: 1967
                    total_copies: 10
                    available_copies: 5
        "404":
          description: Книга не найдена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                NotFoundExample:
                  summary: Пример ошибки, когда книга с таким ID не существует
                  value:
                    error:
                      code: "NOT_FOUND"
                      message: "Книга с указанным ID не найдена"
                      details: []
    patch:
      tags: [Books]
      summary: Обновить данные книги
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBookRequest" }
      responses:
        "200":
          description: Книга обновлена
        "404":
          description: Книга не найдена
    delete:
      tags: [Books]
      summary: Удалить книгу
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Книга удалена
        "409":
          description: Нельзя удалить книгу с активными выдачами
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /readers:
    get:
      tags: [Readers]
      summary: Получить список читателей
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Список читателей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReaderListResponse" }
    post:
      tags: [Readers]
      summary: Добавить читателя
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReaderRequest" }
      responses:
        "201":
          description: Читатель создан
        "422":
          description: Ошибка валидации
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /readers/{id}:
    get:
      tags: [Readers]
      summary: Получить читателя по ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Данные читателя
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reader" }
        "404":
          description: Читатель не найден
    patch:
      tags: [Readers]
      summary: Обновить данные читателя
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateReaderRequest" }
      responses:
        "200":
          description: Данные обновлены
    delete:
      tags: [Readers]
      summary: Удалить читателя
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Читатель удалён
        "409":
          description: Нельзя удалить читателя с активными выдачами
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /loans:
    get:
      tags: [Loans]
      summary: Получить список выдач
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: status
          in: query
          schema: { type: string, enum: [active, overdue, returned] }
          description: "Фильтр по статусу. status=overdue для просроченных"
      responses:
        "200":
          description: Список выдач
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanListResponse" }
    post:
      tags: [Loans]
      summary: Выдать книгу
      description: |
        Создает выдачу. 
        - Требует заголовок Idempotency-Key (TTL 24 часа).
        - Повтор с тем же ключом и телом возвращает тот же результат (replay).
        - Повтор с тем же ключом, но другим телом возвращает 409 IDEMPOTENCY_MISMATCH.
        - Не более 5 активных выдач на читателя.
        - Выдача только при available_copies > 0.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLoanRequest" }
      responses:
        "201":
          description: Выдача создана
        "409":
          description: Конфликт (нет доступных копий, лимит выдач или IDEMPOTENCY_MISMATCH)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                BusinessRuleExample:
                  summary: Пример нарушения бизнес-правила (нет доступных копий)
                  value:
                    error:
                      code: "BUSINESS_RULE_VIOLATION"
                      message: "Нет доступных копий для выдачи"
                      details: []
                IdempotencyMismatchExample:
                  summary: Пример конфликта идемпотентности
                  value:
                    error:
                      code: "IDEMPOTENCY_MISMATCH"
                      message: "Ключ идемпотентности уже использовался с другим телом запроса"
                      details: []
        "422":
          description: Ошибка валидации
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /loans/{id}:
    get:
      tags: [Loans]
      summary: Получить выдачу по ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Данные выдачи
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "404":
          description: Выдача не найдена
  /loans/{id}/return:
    post:
      tags: [Loans]
      summary: Вернуть книгу
      description: Возврат через POST, а не DELETE
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Книга успешно возвращена
        "404":
          description: Выдача не найдена
        "409":
          description: Книга уже была возвращена ранее
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    OffsetParam:
      name: offset
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: "Уникальный ключ операции для предотвращения дублей. Хранится 24 часа"
  schemas:
    Book:
      type: object
      required: [id, title, author, isbn, published_year, total_copies, available_copies]
      properties:
        id:
          type: integer
          examples: [1]
        title:
          type: string
          examples: ["Мастер и Маргарита"]
        author:
          type: string
          examples: ["Михаил Булгаков"]
        isbn:
          type: string
          examples: ["978-5-04-118123-4"]
        published_year:
          type: integer
          examples: [1967]
        total_copies:
          type: integer
          minimum: 0
          examples: [10]
        available_copies:
          type: integer
          readOnly: true 
          description: "Вычисляется сервером из total_copies и активных выдач"
          examples: [5]
    Reader:
      type: object
      required: [id, full_name, email, registered_at]
      properties:
        id:
          type: integer
          examples: [1]
        full_name:
          type: string
          examples: ["Иванов Иван"]
        email:
          type: string
          format: email
          examples: ["ivan@example.com"]
        registered_at:
          type: string
          format: date-time
          examples: ["2026-01-15T10:00:00Z"]
        phone:
          type: string
          deprecated: true
          description: "Устаревшее поле, теперь используется email"
    Loan:
      type: object
      required: [id, book_id, reader_id, loaned_at, due_date]
      properties:
        id:
          type: integer
          examples: [100]
        book_id:
          type: integer
          examples: [1]
        reader_id:
          type: integer
          examples: [1]
        loaned_at:
          type: string
          format: date-time
          examples: ["2026-10-27T10:00:00Z"]
        due_date:
          type: string
          format: date-time
          examples: ["2026-11-10T10:00:00Z"]
        returned_at:
          type: [string, "null"]
          format: date-time
          examples: [null]
    CreateBookRequest:
      type: object
      additionalProperties: false
      required: [title, author, isbn, published_year, total_copies]
      properties:
        title: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        isbn: { type: string }
        published_year: { type: integer }
        total_copies: { type: integer, minimum: 1 }
    UpdateBookRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        isbn: { type: string }
        published_year: { type: integer }
        total_copies: { type: integer, minimum: 1 }
    CreateReaderRequest:
      type: object
      additionalProperties: false
      required: [full_name, email]
      properties:
        full_name: { type: string, minLength: 1 }
        email: { type: string, format: email }
    UpdateReaderRequest:
      type: object
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1 }
        email: { type: string, format: email }
    CreateLoanRequest:
      type: object
      additionalProperties: false
      required: [book_id, reader_id, due_date]
      properties:
        book_id: { type: integer }
        reader_id: { type: integer }
        due_date: 
          type: string
          format: date-time
          description: "Должна быть позже текущей даты"
    Pagination:
      type: object
      properties:
        total: { type: integer, examples: [150] }
        limit: { type: integer, examples: [20] }
        offset: { type: integer, examples: [0] }
    BookListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        pagination: { $ref: "#/components/schemas/Pagination" }
    ReaderListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Reader" }
        pagination: { $ref: "#/components/schemas/Pagination" }
    LoanListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Loan" }
        pagination: { $ref: "#/components/schemas/Pagination" }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, NOT_FOUND, VALIDATION_ERROR, CONFLICT, BUSINESS_RULE_VIOLATION, IDEMPOTENCY_MISMATCH]
              examples: ["VALIDATION_ERROR"]
            message:
              type: string
              examples: ["Некорректные данные запроса"]
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }
                  message: { type: string }